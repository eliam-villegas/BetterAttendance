version: '3.8'

services:

  server:
    container_name: main
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - app-network
    volumes:
      - ./server/uploads:/server/uploads
      - ./scripts:/app/scripts
    privileged: true
    env_file:
      - .env

  web:
    build:
      context: ./server/static/js
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - app-network
    volumes:
      - ./server/uploads:/server/uploads
      - ./scripts:/app/scripts

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    depends_on:
      - server
      - db
    networks:
      - app-network
    env_file:
      - .env
  
  db:
    image: postgres:17.0
    env_file: 
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./auth/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network


volumes:
  scripts:
  logs:
  db_data:

networks:
  app-network:
    driver: bridge
