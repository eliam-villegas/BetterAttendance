version: '3.8'

services:

  server:
    container_name: main
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs
      - ./scripts:/app/scripts

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - server
    volumes:
      - ./logs:/app/logs:ro
      - ./scripts:/app/scripts:ro

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    networks:
      - app-network

volumes:
  scripts:
  logs:

networks:
  app-network:
    driver: bridge
