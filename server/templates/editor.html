<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Texto</title>
    <link href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/editor/editor.main.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="container">
        <div class="row mt-4 align-items-center">
            <div class="col text-start">
                <h2 class="title-sub">Editor de Texto</h2>
            </div>
            <div class="col text-end">
                <label for="theme-select" class="form-label me-2">Seleccionar tema:</label>
                <select id="theme-select" class="form-select d-inline-block w-auto" onchange="changeEditorTheme(this.value)">
                    <option value="vs-dark">Oscuro</option>
                    <option value="vs-light">Claro</option>
                    <option value="hc-black">Alto contraste</option>
                </select>
            </div>
        </div>
        <div id="editor-container" style="width:100%; height:400px; border:1px solid grey;"></div>
    </div>

    <!-- Incluir require.js primero -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <!-- Incluir tu archivo JavaScript personalizado después de require.js -->
    <script src="/static/js/editorIndex.js"></script> <!-- Cambia la ruta si es necesario -->
</body>
</html>
