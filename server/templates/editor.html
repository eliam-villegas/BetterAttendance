{% extends "navbar.html" %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/barralateral.css">
<link rel="stylesheet" href="/static/css/notificacion.css">
<link rel="stylesheet" href="/static/css/pagination.css">
{% endblock %}

{% block content %}
<div class="main-layout">
    <!-- Contenido principal -->
    <div class="container main-content d-flex flex-column justify-content-center align-items-center min-vh-100" data-file="{{ file_name }}">
        <div class="text-end">
            <button class="btn btn-success" onclick="saveTableContent()">Descargar</button>
            <button class="btn btn-primary" onclick="saveChanges()">Guardar Cambios</button>
            <button class="btn btn-success" onclick="historial(this)">Historial de Cambios</button>
        </div>
        <div class="md-6">
            <!-- Tabla para mostrar el contenido del archivo log -->
            <div class="table-responsive mb-3" style="max-height: 800px; overflow-y: auto;">
                <table id="log-table" class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>Tipo de Evento</th>
                            <th>RUT</th>
                            <th>Hora</th>
                            <th>Fecha</th>
                            <th>Acción</th> <!-- Nueva columna para el botón -->
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Filas de datos generadas dinámicamente -->
                    </tbody>
                </table>
            </div>

            <div class="pagination-container" id="pagination-controls"></div>

            <!-- Botón para guardar cambios en la tabla -->

        </div>
    </div>

    <!-- Barra lateral fija a la derecha -->
    <div id="mySidebar" class="sidebar">
        <a href="#" onclick="findDuplicates()">Buscar Duplicados</a>
        <a href="#" onclick="removeDuplicates()">Eliminar Duplicados</a>
        <a href="#" onclick="correctConsecutiveEvents()">Corregir Eventos Consecutivos</a>
        <a href="#" onclick="checkEntriesWithoutExits()">Verificar Entradas sin Salidas</a>
        <a href="#" onclick="insertMissingExits()">Agregar Salidas Faltantes</a>

        <div class="add-record-section">
            <h4>Agregar Nuevo Registro</h4>
            <form id="add-record-form">
                <div class = "form-group">
                    <label for="event-type">Reloj</label>
                    <select id="reloj" class="form-control">
                        <option value="001">1</option>
                        <option value="002">2</option>
                        <option value="003">3</option>
                        <option value="004">4</option>
                        <option value="005">5</option>
                        <option value="006">6</option>
                        <option value="007">7</option>
                        <option value="008">8</option>
                    </select>
                <div class="form-group">
                    <label for="event-type">Tipo de Evento</label>
                    <select id="event-type" class="form-control">
                        <option value="Entrada">Entrada</option>
                        <option value="Salida">Salida</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rut">RUT</label>
                    <input type="text" id="rut" class="form-control" placeholder="Ingrese el RUT">
                </div>
                <div class="form-group">
                    <label for="time">Hora</label>
                    <input type="time" id="time" class="form-control">
                </div>
                <div class="form-group">
                    <label for="date">Fecha</label>
                    <input type="date" id="date" class="form-control">
                </div>
                <button type="button" class="btn btn-primary w-100" onclick="addNewRecord()">Agregar</button>
            </form>
        </div>
    </div>
</div>

<div id="notification" class="notification"></div>

<!-- Scripts -->
<script src="static/js/editor.js"></script> <!-- Script para procesar el log -->
<script src="static/js/barralateral.js"></script>
<script src="static/js/notificacion.js"></script>
{% endblock %}
