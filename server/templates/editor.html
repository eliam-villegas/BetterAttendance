<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Texto</title>
    <link href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/editor/editor.main.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/monacoide.css">
    <link rel="stylesheet" href="/static/css/barralateral.css">
</head>

<body class="d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="container">
        <div class="md-6">
            <div class="col text-start">
                <h2 class="title-sub">Editor de Texto</h2>
            </div>
            <div class="mb-3">
                <label for="file-upload" class="form-label">Subir archivo acá (.log):</label>
                <input type="file" id="file-upload" class="form-control" accept=".log" onchange="loadFileContent(event)">
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <!-- Botones alineados a la izquierda -->
                <div>
                    <button class="btn btn-primary me-2" onclick="backup()">Copia de seguridad</button>
                    <button class="btn btn-secondary" onclick="downloadModifiedContent()">Descargar archivo modificado</button>
                </div>
                <!-- Seleccionar tema alineado a la derecha -->
                <div class="d-flex align-items-center">
                    <label for="theme-select" class="form-label me-2">Seleccionar tema:</label>
                    <select id="theme-select" class="form-select d-inline-block w-auto" onchange="changeEditorTheme(this.value)">
                        <option value="vs-dark">Oscuro</option>
                        <option value="vs-light">Claro</option>
                        <option value="hc-black">Alto contraste</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="editor-container" style="width:100%; height:650px; border:1px solid grey;"></div>
    </div>

    <!-- Botón para abrir/cerrar la barra lateral -->
    <div id="toggleButton" class="toggle-btn" onclick="toggleSidebar()">☰</div>

    <!-- Barra lateral derecha -->
    <div id="mySidebar" class="sidebar">
        <a href="#" onclick="funcion1()">Función 1</a>
        <a href="#" onclick="funcion2()">Función 2</a>
        <a href="#" onclick="funcion3()">Función 3</a>
    </div>

    <!-- Incluir require.js primero -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <!-- Incluir tu archivo JavaScript personalizado después de require.js -->
    <script src="/static/js/editorIndex.js"></script> <!-- Cambia la ruta si es necesario -->
    <!-- Scripts para controlar la barra lateral -->
    <script src="/static/js/barralateral.js"></script>
</body>

</html>
