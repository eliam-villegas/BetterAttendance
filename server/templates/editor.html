<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización de Archivo Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/monacoide.css">
    <link rel="stylesheet" href="/static/css/barralateral.css">
</head>
<body class="d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="container">
        <div class="md-6">
            <div class="col text-start">
                <h2 class="title-sub">Visualización de Archivo Log</h2>
            </div>
            <div class="mb-3">
                <label for="file-upload" class="form-label">Subir archivo acá (.log):</label>
                <input type="file" id="file-upload" class="form-control" accept=".log" onchange="loadFileContent(event)">
            </div>
            
            <!-- Tabla para mostrar el contenido del archivo log -->
            <div class="table-responsive mb-3">
                <table id="log-table" class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>Tipo de Evento</th>
                            <th>RUT Encriptado</th>
                            <th>Hora</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Filas de datos generadas dinámicamente aquí -->
                    </tbody>
                </table>
            </div>

            <!-- Botón para guardar cambios en la tabla -->
            <div class="text-end">
                <button class="btn btn-success" onclick="saveTableContent()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="static/js/editor.js"></script> <!-- Script para procesar el log -->
</body>
</html>
