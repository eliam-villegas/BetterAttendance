{% extends "navbar.html" %}

<head>
    <title>Historial de cambios</title>
</head>
{% block content %}

    <h1>Historial de cambios para: {{ file }}</h1>
    <ul>
        {% for commit in history %}
            <li>
                <strong>CAMBIO :</strong> {{ commit.message }} <br>
                <hr>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
