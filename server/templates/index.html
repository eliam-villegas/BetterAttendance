<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Selección y Flujo de Trabajo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notificacion.css') }}">
</head>
<body class="d-flex flex-column justify-content-center align-items-center min-vh-100">

    <img src="{{ url_for('static', filename='images/LogoHospitalFusion.png') }}" alt="Logo Hospital" class="background-logo">

    <div class="container">
        <div class="row">
            <!-- Columna izquierda: Selección de día -->
            <div class="col-md-6 border-end">
                <h1 class="display-10 text-center">Selección de día</h1>
                <div id="interactive-calendar" class="calendar">
                    <div class="calendar-header">
                        <button id="prev-month">&lt;</button>
                        <h2 class="display-10 text-center" id="month-year"></h2>
                        <button id="next-month">&gt;</button>
                    </div>
                    <div class="days-of-week">
                        <div>Dom</div>
                        <div>Lun</div>
                        <div>Mar</div>
                        <div>Mié</div>
                        <div>Jue</div>
                        <div>Vie</div>
                        <div>Sáb</div>
                    </div>
                    <div class="calendar-days" id="calendar-days"></div>
                </div>
            </div>

            <!-- Columna derecha: Interfaz de flujo de trabajo -->
            <div class="col-md-6">
                <h1 class="display-10 text-center">Flujo de trabajo: día seleccionado</h1>
                <p id="selected-date" class="text-muted text-center">Seleccione una fecha para mostrar aquí.</p>
            
                <!-- Aquí mostramos el nombre del archivo -->
                <p id="file-name-display" class="text-muted text-center">Archivo: Ninguno</p>
            
                <div>
                    <div class="d-flex flex-column justify-content-center align-items-center">

                       
                            <form id="uploadForm" enctype="multipart/form-data">
                                <div id="dropzone" class="border border-primary rounded p-3 text-center">
                                    <p class="mb-2">Arrastra y suelta el archivo aquí o haz clic para seleccionarlo</p>
                                    <input type="file" name="file" id="fileInput"/>
                                    <button type="button" class="btn btn-secondary" onclick="loadFileContent(document.getElementById('fileInput'))">Subir archivo</button>
                                </div>

                                <div id="message" class="mt-3" style="display:none;">
                                    <div id="message-text" class="alert"></div>
                                </div>
                            </form>
                            
                    </div>
                    
                </div>
            
                <!-- Botón para ir al editor -->
                <div class="text-center mt-4">
                    <a href="#" class="btn btn-primary disabled">Visualizar Archivo</a>
                </div>
            </div>
        </div>
    </div>
    <div id="notification" class="notification"></div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dragndrop.js') }}"></script>
    <script src="{{ url_for('static', filename='js/notificacion.js') }}"></script>


</body>
</html>
