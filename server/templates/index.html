<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Selección, Flujo de Trabajo y Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/node_modules/monaco-editor/min/vs/editor/editor.main.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">

</head>

<body class="d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="container">
        <div class="row">
            <!-- Columna izquierda: Selección de día -->
            <div class="col-md-6 border-end">
                <h1 class="display-10 text-center">Selección de día</h1>
                <div id="interactive-calendar" class="calendar">
                    <div class="calendar-header">
                        <button id="prev-month">&lt;</button>
                        <h2 class="display-10 text-center" id="month-year"></h2>
                        <button id="next-month">&gt;</button>
                    </div>
                    <div class="days-of-week">
                        <div>Dom</div>
                        <div>Lun</div>
                        <div>Mar</div>
                        <div>Mié</div>
                        <div>Jue</div>
                        <div>Vie</div>
                        <div>Sáb</div>
                    </div>
                    <div class="calendar-days" id="calendar-days"></div>
                </div>
                <div class="mb-3">
                    <label for="file-upload" class="form-label">Subir archivo acá (.txt):</label>
                    <input type="file" id="file-upload" class="form-control" accept=".txt, .log"
                        onchange="loadFileContent(event)">
                </div>
                <button class="btn btn-primary" onclick="backup()">Copia de seguridad</button>
            </div>

            <!-- Columna derecha: Interfaz de flujo de trabajo -->
            <div class="col-md-6">
                <h1 class="display-10 text-center">Flujo de trabajo: día seleccionado</h1>
                <p id="selected-date" class="text-muted text-center">Seleccione una fecha para mostrar aquí.</p>
            </div>
        </div>

        <!-- Contenedor para el editor Monaco -->
        <div class="row mt-4 align-items-center">
            <div class="col text-start">
                <h2 class="title-sub">Editor de Texto</h2>
            </div>
            <div class="col text-end">
                <label for="theme-select" class="form-label me-2">Seleccionar tema:</label>
                <select id="theme-select" class="form-select d-inline-block w-auto"
                    onchange="changeEditorTheme(this.value)">
                    <option value="vs-dark">Oscuro</option>
                    <option value="vs-light">Claro</option>
                    <option value="hc-black">Alto contraste</option>
                </select>
            </div>
        </div>
        <div id="editor-container" style="width:100%; height:400px; border:1px solid grey;"></div>
    </div>

    <!-- RequireJS y el script de editorIndex.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script src="/static/js/editorIndex.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
</body>

</html>
